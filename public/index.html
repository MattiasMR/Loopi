<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#155b43">
  <title>Loopi | Espacio de prueba</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#17251e;background:#f7f7f2;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0}.workspace-bar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#fff;border-bottom:1px solid #e5eae4;box-shadow:0 2px 10px #17251e08;position:relative;z-index:2}.identity{display:flex;align-items:center;gap:10px}.logo{height:34px;width:34px;border-radius:11px;background:#155b43;color:white;display:grid;place-items:center;font-size:21px;font-weight:700}.name{font-size:19px;font-weight:800;letter-spacing:-1px;color:#155b43}.name i{font-style:normal;color:#f1ad3c}.caption{border-left:1px solid #e4e8e3;padding-left:11px;color:#839087;font-size:10px;margin-left:4px}.right-controls{display:flex;align-items:center;gap:10px}.switcher{display:flex;align-items:center;gap:3px;padding:4px;background:#f0f3ee;border:1px solid #e6eae4;border-radius:11px}.switcher button{border:0;background:transparent;padding:8px 13px;border-radius:8px;color:#77837a;font-size:11px;font-weight:700;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}.switcher button:hover{color:#155b43}.switcher button[aria-pressed="true"]{background:#fff;color:#155b43;box-shadow:0 1px 5px #17251e17}.close-button{border:1px solid #e6eae4;border-radius:9px;background:#fff;color:#526158;padding:8px 12px;font-size:11px;font-weight:700;cursor:pointer}.close-button:hover{border-color:#cbd8cf;color:#155b43}.workspace{height:calc(100dvh - 62px);min-height:420px}.workspace iframe{display:none;width:100%;height:100%;border:0;background:#fff}.workspace iframe.active{display:block}.closed{height:100%;display:grid;place-content:center;text-align:center;padding:24px;color:#526158}.closed h1{color:#155b43}.closed button{justify-self:center;border:0;border-radius:9px;background:#155b43;color:white;padding:11px 18px;font-weight:700;cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:560px){.workspace-bar{height:58px;padding:0 10px}.workspace{height:calc(100dvh - 58px)}.caption{display:none}.name{font-size:17px}.switcher button{padding:8px 9px;font-size:10px}.close-button{padding:8px;font-size:10px}.right-controls{gap:5px}.logo{width:30px;height:30px}}
  </style>
</head>
<body>
  <header class="workspace-bar">
    <div class="identity"><span class="logo" aria-hidden="true">↻</span><span class="name">loop<i>i</i></span><span class="caption">Espacio de prueba</span></div>
    <div class="right-controls">
      <div class="switcher" role="group" aria-label="Cambiar espacio Loopi">
        <button type="button" data-space="client" aria-pressed="true">Cliente</button>
        <button type="button" data-space="operations" aria-pressed="false">Operaciones</button>
      </div>
      <button class="close-button" id="close-loopi" type="button" title="Detener Loopi">Cerrar Loopi</button>
    </div>
  </header>
  <main class="workspace" aria-label="Vista de Loopi">
    <iframe id="client-frame" class="active" src="cliente.html" title="Espacio del cliente"></iframe>
    <iframe id="operations-frame" data-src="operacion.html" title="Espacio de operaciones" loading="lazy"></iframe>
  </main>
  <span class="sr-only" id="space-status" aria-live="polite">Vista de cliente</span>
  <script>
    const buttons = [...document.querySelectorAll('[data-space]')];
    const frames = {
      client: document.getElementById('client-frame'),
      operations: document.getElementById('operations-frame')
    };
    function showSpace(space) {
      const selected = space === 'operations' ? 'operations' : 'client';
      for (const key of Object.keys(frames)) {
        const frame = frames[key];
        if (key === selected && !frame.src) frame.src = frame.dataset.src;
        frame.classList.toggle('active', key === selected);
      }
      buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.space === selected)));
      document.getElementById('space-status').textContent = selected === 'operations' ? 'Vista de operaciones' : 'Vista de cliente';
      sessionStorage.setItem('loopi-space', selected);
    }
    buttons.forEach(button => button.addEventListener('click', () => showSpace(button.dataset.space)));
    showSpace(sessionStorage.getItem('loopi-space') || 'client');
    const closeButton = document.getElementById('close-loopi');
    if (!['127.0.0.1', 'localhost'].includes(location.hostname)) closeButton.hidden = true;
    document.getElementById('close-loopi').addEventListener('click', async () => {
      const button = document.getElementById('close-loopi');
      button.disabled = true;
      button.textContent = 'Cerrando…';
      try { await fetch('/__loopi/stop', { method: 'POST' }); } catch (_) {}
      document.querySelector('.workspace').innerHTML = '<section class="closed"><h1>Loopi se cerró</h1><p>Ya puedes cerrar esta pestaña del navegador.</p><button type="button" onclick="window.close()">Cerrar pestaña</button></section>';
      button.hidden = true;
    });
  </script>
</body>
</html>
